{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>Reset Password</h2>
    <p>Enter your email - we will send you a reset link.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send Reset Link</button>
    </form>
</div>
{% endblock %}
