{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>Register</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create Account</button>
    </form>

    <p style="text-align:center; margin-top:15px;">
        Already have an account? <a href="/accounts/login/">Login</a>
    </p>
</div>
{% endblock %}
